name: Build and deploy manual

# Both branches are built in every run: main is the site at the root,
# preparation (the full text) a preview under /preview/, kept out of
# search engines. A push to either branch redeploys both.
on:
  push:
    branches: [main, preparation]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel runs that are superseded
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Installs the Lean toolchain from lean-toolchain, downloads the
      # Mathlib build cache (lake exe cache get), and runs `lake build`,
      # which compiles the Leancourse library and the `leancourse`
      # executable. test/lint are disabled (this project has no drivers).
      - name: Build Lean project (with Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          test: false
          lint: false
          use-mathlib-cache: true

      # Run the generator: writes the rendered site to _out/html-multi
      - name: Generate the site
        run: lake exe leancourse --output _out/

      # The slide decks are a separate Verso genre (VersoSlides) and are
      # not part of the manual's own output, so they are generated into
      # the artifact directory afterwards.  `slides` is not a default
      # target, so this also builds it.  The argument is the base
      # directory; each deck lands in a subdirectory named after it, so
      # adding a deck needs no change here.
      - name: Generate the slide decks
        run: lake exe slides _out/html-multi/slides

      - name: Keep the main site
        run: mv _out/html-multi site

      # Same build again on preparation. .lake stays, so only the
      # modules that differ are recompiled.
      - name: Build the preparation preview
        run: |
          git checkout --force origin/preparation
          rm -rf _out
          lake build
          lake exe leancourse --output _out/
          lake exe slides _out/html-multi/slides
          find _out/html-multi -name '*.html' -exec \
            sed -i 's|<head>|<head><meta name="robots" content="noindex">|' {} +
          mv _out/html-multi site/preview

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
